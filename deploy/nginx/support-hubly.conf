server {
    listen 80;
    listen [::]:80;
    server_name support.hublyapp.com.br api-support.hublyapp.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name support.hublyapp.com.br;

    ssl_certificate /etc/letsencrypt/live/support.hublyapp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/support.hublyapp.com.br/privkey.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api-support.hublyapp.com.br;

    ssl_certificate /etc/letsencrypt/live/api-support.hublyapp.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api-support.hublyapp.com.br/privkey.pem;

    client_max_body_size 12m;

    location / {
        proxy_pass http://127.0.0.1:3003;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
