services:
  api:
    image: ghcr.io/sidneyjfg/support-hubly-api:latest
    container_name: support_ticket_api
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      DB_HOST: host.docker.internal
      DB_PORT: 3306
      API_PORT: 3003
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:3003:3003"
    volumes:
      - support_ticket_uploads:/app/apps/api/uploads
    networks:
      - hubly-network

  web:
    image: ghcr.io/sidneyjfg/support-hubly-web:latest
    container_name: support_ticket_web
    restart: unless-stopped
    ports:
      - "127.0.0.1:3004:80"
    depends_on:
      - api
    networks:
      - hubly-network

volumes:
  support_ticket_uploads:

networks:
  hubly-network:
    external: true
